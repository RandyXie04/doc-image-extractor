name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "refactor/**"
      - "chore/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python & Configs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8.0"

      - name: Run Ruff lint (blocking gate)
        run: ruff check src main.py config tests

      - name: Validate JSON configuration files
        run: |
          python -c "
          import json, pathlib
          files = [
              'pyrightconfig.json',
              'version.json',
              'frontend/package.json',
              'frontend/tsconfig.json',
              'config/fonts.json',
              'config/symbol_mapping.json',
          ]
          for f in files:
              json.loads(pathlib.Path(f).read_text(encoding='utf-8-sig'))
              print(f'OK: {f}')
          "

  typecheck-python:
    name: Typecheck (Python / Pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0.0"
          pip install -r requirements-ci.txt

      - name: Pyright strict gate (contracts, API & core entrypoints)
        run: |
          python -m pyright \
            main.py \
            src/web/app.py \
            src/web/dependencies.py \
            src/web/schemas.py \
            src/web/routers/ocr_router.py \
            src/web/routers/pod_router.py \
            src/web/routers/system_router.py \
            src/web/routers/tools_router.py \
            src/extraction/contracts.py \
            src/plugins \
            src/scripts/generate_ts_contracts.py

      - name: Pyright full-repo baseline report (advisory)
        continue-on-error: true
        run: python -m pyright src main.py

  build-and-check:
    name: Build & Contract Check (Python + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lightweight CI Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0.0"
          pip install -r requirements-ci.txt

      - name: Python bytecode compile check
        run: python -m compileall -q -f src main.py config tests

      - name: Verify Pydantic -> TypeScript contract parity
        run: python src/scripts/generate_ts_contracts.py --check

      - name: Frontend TypeScript & JS typecheck / build verification
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  test-unit-regression:
    name: Tests (Non-Heavy Unit & Regression)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      YOLO_CONFIG_DIR: ${{ runner.temp }}\ultralytics
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install lightweight CI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0.0"
          pip install -r requirements-ci.txt

      - name: Run non-heavy unit & regression tests
        shell: pwsh
        run: |
          python -m pytest --ignore=tests/e2e --ignore=tests/test_formula_recognizer_stress.py -m "not heavy" -k "not test_recognition_predictor_blank_crop_short_circuit_with_index_preservation" --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-windows
          path: coverage.xml

  security-scan:
    name: Security Scan (SAST & Dependency Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.7.0" "pip-audit>=2.7.0"

      - name: Run Bandit SAST (blocking Medium & High gate)
        run: bandit -r src main.py -ll

      - name: Audit CI dependency vulnerabilities (advisory)
        continue-on-error: true
        run: pip-audit -r requirements-ci.txt

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - typecheck-python
      - build-and-check
      - test-unit-regression
      - security-scan
    steps:
      - name: Verify all required CI jobs passed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck-python=${{ needs.typecheck-python.result }}"
          echo "build-and-check=${{ needs.build-and-check.result }}"
          echo "test-unit-regression=${{ needs.test-unit-regression.result }}"
          echo "security-scan=${{ needs.security-scan.result }}"
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck-python.result }}" != "success" ]] || \
             [[ "${{ needs.build-and-check.result }}" != "success" ]] || \
             [[ "${{ needs.test-unit-regression.result }}" != "success" ]] || \
             [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
