<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍 PDF 全自動 OCR 與排版</title>
    <style>
        :root { --primary: #ea580c; --primary-hover: #c2410c; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 3rem; }
        .container { background: var(--card); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 680px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .header a { text-decoration: none; color: var(--primary); font-weight: bold; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 3rem; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 1.5rem; transition: border-color 0.2s, background-color 0.2s; }
        .upload-area.dragover { border-color: var(--primary); background: #fff7ed; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        #status { margin-top: 1rem; text-align: center; font-weight: 500; color: #475569; }
        .btn-group { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .btn-group a { flex: 1; min-width: 160px; text-align: center; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; color: white; display: none; }
        #downloadDocxBtn { background: #2563eb; }
        #downloadMdBtn { background: #16a34a; }
        .setting-card { background: #f8fafc; padding: 1.25rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/">◀ 返回首頁</a>
            <h2 style="margin: 0;">📄 全自動 OCR 與排版管線</h2>
            <div style="width: 80px;"></div>
        </div>
        
        <!-- 自訂範本區塊 -->
        <div class="setting-card">
            <h3 style="margin-top: 0; color: #334155; font-size: 1.1rem;">📚 樣式範本設定</h3>
            <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 1rem;">
                目前使用範本: <strong id="currentTemplateName">載入中...</strong>
            </p>
            <div style="display: flex; gap: 10px;">
                <input type="file" id="templateInput" accept=".docx" style="display: none;">
                <button type="button" class="btn" style="background: #475569; width: auto; font-size: 0.95rem; padding: 8px 16px;" onclick="document.getElementById('templateInput').click()">上傳自訂 .docx 範本</button>
                <span id="templateUploadStatus" style="align-self: center; color: #16a34a; font-weight: bold; font-size: 0.9rem;"></span>
            </div>
            
            <div id="styleMappingSection" style="margin-top: 1rem; display: none;">
                <h4 style="margin: 0 0 0.5rem 0; color: #475569; font-size: 0.95rem;">自訂階層樣式對應 (可選)</h4>
                <div style="display: flex; gap: 1rem; align-items: center; font-size: 0.9rem; flex-wrap: wrap;">
                    <div>
                        <label for="h1Style">一級標題 (#): </label>
                        <select id="h1Style" style="padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1;"><option value="">(預設 Heading 1)</option></select>
                    </div>
                    <div>
                        <label for="h2Style">二級標題 (##): </label>
                        <select id="h2Style" style="padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1;"><option value="">(預設 Heading 2)</option></select>
                    </div>
                    <div>
                        <label for="h3Style">三級標題 (###): </label>
                        <select id="h3Style" style="padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1;"><option value="">(預設 Heading 3)</option></select>
                    </div>
                </div>
            </div>
        </div>

        <form id="uploadForm">
            <!-- 進階轉檔與裁切設定 -->
            <div class="setting-card">
                <h3 style="margin-top: 0; color: #334155; font-size: 1.1rem;">⚙️ 轉檔引擎與邊界裁切設定</h3>
                
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 6px; font-weight:bold; font-size: 0.9rem; color: #475569;">PDF 處理引擎</label>
                    <select name="engine" id="engineSelect" style="padding: 8px 12px; width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; background: white;">
                        <option value="auto">自動偵測 (推薦) - 向量 PDF 啟用 PyMuPDF 高速解析；掃描 PDF 啟用 RapidDoc 深度 OCR</option>
                        <option value="pymupdf">高速提取 (PyMuPDF) - 適用原生向量 PDF，秒級解析且記憶體輕量</option>
                        <option value="rapiddoc">深度識別 (RapidDoc) - 適用掃描書、圖片轉曲 PDF，支援中文 OCR 與複雜版面</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="display:block; margin-bottom: 4px; font-weight:bold; font-size: 0.9rem; color: #475569;">
                            左側裁切比例: <span id="leftRatioVal" style="color: #ea580c;">0.0</span>
                        </label>
                        <input type="range" id="leftRatio" name="left_ratio" min="0" max="0.4" step="0.01" value="0.0" style="width: 100%;">
                        <div style="font-size: 0.8rem; color: #94a3b8;">可裁除左側裝訂線或黑邊</div>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom: 4px; font-weight:bold; font-size: 0.9rem; color: #475569;">
                            右側裁切比例: <span id="rightRatioVal" style="color: #ea580c;">1.0</span>
                        </label>
                        <input type="range" id="rightRatio" name="right_ratio" min="0.6" max="1.0" step="0.01" value="1.0" style="width: 100%;">
                        <div style="font-size: 0.8rem; color: #94a3b8;">可裁除右側留白或裝訂線</div>
                    </div>
                </div>
            </div>

            <div class="upload-area" id="dropZone">
                <p style="margin: 0; font-size: 1.1rem; color: #475569;">點擊選擇，或將 PDF 拖曳至此</p>
                <input type="file" id="fileInput" accept=".pdf" style="display: none;">
            </div>
            <div id="fileInfo" style="text-align: center; margin-bottom: 1rem; font-weight: bold;"></div>
            <button type="submit" class="btn" id="submitBtn" disabled>開始上傳並執行 OCR / 轉檔</button>
        </form>

        <div id="status"></div>
        <div class="btn-group">
            <a id="downloadDocxBtn" href="#">⬇️ 下載 Word (.docx)</a>
            <a id="downloadMdBtn" href="#">📄 下載 Markdown (.md)</a>
            <a id="outlineEditorBtn" href="javascript:void(0)" style="background: #8b5cf6;">✏️ 檢視與微調大綱</a>
        </div>
        
        <!-- Outline Editor Modal/Section -->
        <div id="outlineEditorSection" style="display: none; margin-top: 2rem; background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid #cbd5e1;">
            <h3 style="margin-top: 0;">🌳 大綱微調 (Outline Editor)</h3>
            <p style="color: #64748b; font-size: 0.9rem;">系統擷取出的標題如下，您可以手動修正階層，完成後點擊重新產生 DOCX。</p>
            <div id="outlineList" style="max-height: 400px; overflow-y: auto; background: white; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 1rem;">
                載入中...
            </div>
            <button id="saveOutlineBtn" class="btn" style="background: #16a34a; width: 100%;">儲存並重新產生 Word 文件</button>
            <div id="outlineSaveStatus" style="margin-top: 1rem; text-align: center; font-weight: bold;"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const downloadDocxBtn = document.getElementById('downloadDocxBtn');
        const downloadMdBtn = document.getElementById('downloadMdBtn');
        const outlineEditorBtn = document.getElementById('outlineEditorBtn');
        let currentFile = null;

        const templateInput = document.getElementById('templateInput');
        const templateUploadStatus = document.getElementById('templateUploadStatus');
        const currentTemplateName = document.getElementById('currentTemplateName');

        // Margin sliders
        const leftRatioInput = document.getElementById('leftRatio');
        const rightRatioInput = document.getElementById('rightRatio');
        const leftRatioVal = document.getElementById('leftRatioVal');
        const rightRatioVal = document.getElementById('rightRatioVal');

        if (leftRatioInput && leftRatioVal) {
            leftRatioInput.oninput = function() { leftRatioVal.textContent = this.value; };
        }
        if (rightRatioInput && rightRatioVal) {
            rightRatioInput.oninput = function() { rightRatioVal.textContent = this.value; };
        }

        async function fetchTemplateStyles() {
            try {
                const res = await fetch('/api/get_template_styles');
                const data = await res.json();
                if (data.status === 'success' && data.styles.length > 0) {
                    const h1 = document.getElementById('h1Style');
                    const h2 = document.getElementById('h2Style');
                    const h3 = document.getElementById('h3Style');
                    
                    h1.innerHTML = '<option value="">(預設 Heading 1)</option>';
                    h2.innerHTML = '<option value="">(預設 Heading 2)</option>';
                    h3.innerHTML = '<option value="">(預設 Heading 3)</option>';
                    
                    data.styles.forEach(s => {
                        h1.innerHTML += `<option value="${s}">${s}</option>`;
                        h2.innerHTML += `<option value="${s}">${s}</option>`;
                        h3.innerHTML += `<option value="${s}">${s}</option>`;
                    });
                    
                    document.getElementById('styleMappingSection').style.display = 'block';
                }
            } catch (err) {
                console.error("無法取得樣式", err);
            }
        }

        async function loadCurrentTemplate() {
            try {
                const res = await fetch('/api/get_current_template');
                const data = await res.json();
                currentTemplateName.textContent = data.name;
                if (data.has_custom) {
                    currentTemplateName.style.color = '#ea580c';
                }
                fetchTemplateStyles();
            } catch (err) {
                currentTemplateName.textContent = '無法取得狀態';
            }
        }
        window.addEventListener('DOMContentLoaded', loadCurrentTemplate);

        templateInput.onchange = async (e) => {
            if (e.target.files.length === 0) return;
            const file = e.target.files[0];
            const formData = new FormData();
            formData.append('file', file);
            
            templateUploadStatus.textContent = '上傳中...';
            templateUploadStatus.style.color = '#64748b';
            
            try {
                const res = await fetch('/api/upload_template', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    templateUploadStatus.textContent = '✅ ' + data.message;
                    templateUploadStatus.style.color = '#16a34a';
                    loadCurrentTemplate();
                } else {
                    throw new Error(data.detail);
                }
            } catch (err) {
                templateUploadStatus.textContent = '❌ 上傳失敗: ' + err.message;
                templateUploadStatus.style.color = '#dc2626';
            }
            templateInput.value = '';
        };

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                alert('請選擇 PDF 格式之檔案！');
                return;
            }
            currentFile = file;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileInfo.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding: 10px; background: #fff7ed; border-radius: 8px; border: 1px solid #fed7aa;">
                    <span style="font-size:2rem;">📄</span>
                    <span style="color: #334155;">已選擇: <b>${file.name}</b></span>
                    <span style="color:#64748b; font-weight:normal; font-size:0.85rem;">檔案大小: ${sizeMB} MB</span>
                </div>`;
            submitBtn.disabled = false;
            downloadDocxBtn.style.display = 'none';
            downloadMdBtn.style.display = 'none';
            outlineEditorBtn.style.display = 'none';
            statusDiv.textContent = '';
        }

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentFile) return;

            submitBtn.disabled = true;
            downloadDocxBtn.style.display = 'none';
            downloadMdBtn.style.display = 'none';
            outlineEditorBtn.style.display = 'none';

            const formData = new FormData();
            formData.append('file', currentFile);
            
            const h1Style = document.getElementById('h1Style')?.value;
            const h2Style = document.getElementById('h2Style')?.value;
            const h3Style = document.getElementById('h3Style')?.value;
            if (h1Style || h2Style || h3Style) {
                formData.append('style_mapping', JSON.stringify({
                    h1: h1Style,
                    h2: h2Style,
                    h3: h3Style
                }));
            }

            const engineVal = document.getElementById('engineSelect')?.value || 'auto';
            const leftRatioVal = document.getElementById('leftRatio')?.value || '0.0';
            const rightRatioVal = document.getElementById('rightRatio')?.value || '1.0';

            formData.append('engine', engineVal);
            formData.append('left_ratio', leftRatioVal);
            formData.append('right_ratio', rightRatioVal);

            statusDiv.innerHTML = `
                <div style="margin-top:20px; padding:20px; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc; text-align: left;">
                    <div style="font-weight:bold; margin-bottom:10px; color:#334155;">🚀 伺服器處理進度</div>
                    <div style="width: 100%; background: #e2e8f0; border-radius: 4px; overflow: hidden; height: 12px; margin-bottom:10px;">
                        <div id="progressBar" style="height: 12px; background: #ea580c; width: 0%; transition: width 0.3s;"></div>
                    </div>
                    <div id="progressText" style="color: #475569; font-size: 0.9rem;">正在啟動背景轉檔任務...</div>
                </div>
            `;

            try {
                const response = await fetch('/api/upload_and_run_ocr', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'OCR 啟動失敗');
                }

                const result = await response.json();
                const stem = result.filename_stem;
                
                let isFinished = false;
                const pollInterval = setInterval(async () => {
                    if (isFinished) return;
                    try {
                        const res = await fetch(`/api/ocr_progress/${stem}`);
                        const prog = await res.json();
                        
                        const pBar = document.getElementById('progressBar');
                        const pText = document.getElementById('progressText');
                        
                        if (pBar && prog.progress !== undefined) {
                            pBar.style.width = prog.progress + '%';
                        }
                        if (pText && prog.message) {
                            pText.innerText = prog.message;
                        }
                        
                        if (prog.status === 'completed' || prog.progress === 100) {
                            isFinished = true;
                            clearInterval(pollInterval);
                            onComplete(stem);
                        } else if (prog.status === 'failed') {
                            isFinished = true;
                            clearInterval(pollInterval);
                            throw new Error(prog.message || '後端轉檔發生錯誤');
                        }
                    } catch(e) {
                        console.error('Polling error:', e);
                    }
                }, 1000);
                
                function onComplete(filename_stem) {
                    statusDiv.innerHTML += `<div style="margin-top:1rem; color:#16a34a; font-weight:bold;">✅ 處理完成！請點選以下按鈕另存新檔：</div>`;
                    
                    const btnContainer = document.createElement('div');
                    btnContainer.style.display = 'flex';
                    btnContainer.style.gap = '10px';
                    btnContainer.style.marginTop = '15px';
                    btnContainer.style.flexWrap = 'wrap';
                    
                    const btnDocx = document.createElement('button');
                    btnDocx.className = 'btn';
                    btnDocx.style.background = '#2563eb';
                    btnDocx.style.flex = '1';
                    btnDocx.innerText = '📁 本機另存 DOCX (原生視窗)';
                    btnDocx.onclick = () => nativeSave(filename_stem, 'docx');
                    
                    const btnMd = document.createElement('button');
                    btnMd.className = 'btn';
                    btnMd.style.background = '#16a34a';
                    btnMd.style.flex = '1';
                    btnMd.innerText = '📁 本機另存 Markdown (原生視窗)';
                    btnMd.onclick = () => nativeSave(filename_stem, 'md');
                    
                    btnContainer.appendChild(btnDocx);
                    btnContainer.appendChild(btnMd);
                    statusDiv.appendChild(btnContainer);
                    
                    outlineEditorBtn.style.display = 'block';
                    outlineEditorBtn.dataset.stem = filename_stem;
                    submitBtn.disabled = false;
                }

            } catch (err) {
                statusDiv.innerHTML = `<div style="margin-top:1rem; padding:1rem; background:#fef2f2; border:1px solid #f87171; border-radius:8px; color:#dc2626;">
                    ❌ <b>執行失敗：</b>${err.message} <br>
                    <button type="button" onclick="submitBtn.click()" style="margin-top:10px; padding: 8px 16px; cursor:pointer; background: white; border: 1px solid #f87171; border-radius: 6px;">🔄 重新嘗試上傳</button>
                </div>`;
                submitBtn.disabled = false;
            }
        };
        
        async function nativeSave(stem, ext) {
            try {
                const source_path = `data/03_output/${stem}.${ext}`;
                const res = await fetch('/api/native_save_file', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({source_path, suggested_filename: `${stem}.${ext}`})
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert(`✅ 已成功儲存至：${result.saved_path}`);
                }
            } catch(e) {
                alert('❌ 儲存失敗：' + e.message);
            }
        }

        // Outline Editor Logic
        let currentMdLines = [];
        
        outlineEditorBtn.onclick = async function() {
            const stem = this.dataset.stem;
            if (!stem) return;
            
            document.getElementById('outlineEditorSection').style.display = 'block';
            document.getElementById('outlineList').innerHTML = '讀取中...';
            
            try {
                const res = await fetch(`/api/get_markdown/${stem}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                
                currentMdLines = data.content.split('\n');
                renderOutlineList();
            } catch (err) {
                document.getElementById('outlineList').innerHTML = `<span style="color:red">無法讀取 Markdown 檔案: ${err.message}</span>`;
            }
        };
        
        function renderOutlineList() {
            const listDiv = document.getElementById('outlineList');
            listDiv.innerHTML = '';
            
            currentMdLines.forEach((line, index) => {
                const match = line.match(/^(#{1,3})\s+(.*)$/);
                if (match) {
                    const level = match[1].length;
                    const text = match[2];
                    
                    const row = document.createElement('div');
                    row.style.display = 'flex';
                    row.style.gap = '10px';
                    row.style.marginBottom = '8px';
                    row.style.alignItems = 'center';
                    row.style.paddingLeft = `${(level - 1) * 20}px`;
                    
                    const select = document.createElement('select');
                    select.innerHTML = `
                        <option value="0">一般內文</option>
                        <option value="1" ${level===1?'selected':''}>H1</option>
                        <option value="2" ${level===2?'selected':''}>H2</option>
                        <option value="3" ${level===3?'selected':''}>H3</option>
                    `;
                    select.onchange = (e) => {
                        const newLevel = parseInt(e.target.value);
                        let cleanText = line.replace(/^(#{1,3})\s+/, '');
                        if (newLevel > 0) {
                            currentMdLines[index] = '#'.repeat(newLevel) + ' ' + cleanText;
                        } else {
                            currentMdLines[index] = cleanText;
                        }
                    };
                    
                    const span = document.createElement('span');
                    span.textContent = text;
                    span.style.flex = '1';
                    
                    row.appendChild(select);
                    row.appendChild(span);
                    listDiv.appendChild(row);
                }
            });
            
            if (listDiv.children.length === 0) {
                listDiv.innerHTML = '<span style="color:#64748b;">未偵測到任何標題，這可能是因為全文書籍皆為內文，或者偵測未命中。</span>';
            }
        }
        
        document.getElementById('saveOutlineBtn').onclick = async function() {
            const stem = outlineEditorBtn.dataset.stem;
            const statusDiv = document.getElementById('outlineSaveStatus');
            
            statusDiv.textContent = '儲存並重新產生 Word 中...';
            statusDiv.style.color = '#ea580c';
            this.disabled = true;
            
            try {
                const res = await fetch(`/api/update_and_rebuild_docx/${stem}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ content: currentMdLines.join('\n') })
                });
                const data = await res.json();
                if (res.ok) {
                    statusDiv.textContent = '✅ ' + data.message;
                    statusDiv.style.color = '#16a34a';
                } else {
                    throw new Error(data.detail);
                }
            } catch (err) {
                statusDiv.textContent = '❌ 失敗: ' + err.message;
                statusDiv.style.color = '#dc2626';
            }
            this.disabled = false;
        };
    </script>
<script src="/static/sidebar.js"></script>
</body>
</html>
