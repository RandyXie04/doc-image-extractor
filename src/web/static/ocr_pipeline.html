<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>書籍 PDF 全自動 OCR 與排版</title>
    <style>
        :root { --primary: #ea580c; --primary-hover: #c2410c; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 3rem; }
        .container { background: var(--card); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 650px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .header a { text-decoration: none; color: var(--primary); font-weight: bold; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 3rem; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 1.5rem; }
        .upload-area.dragover { border-color: var(--primary); background: #fff7ed; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        #status { margin-top: 1rem; text-align: center; font-weight: 500; color: #475569; }
        .btn-group { display: flex; gap: 1rem; margin-top: 1rem; }
        .btn-group a { flex: 1; text-align: center; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; color: white; display: none; }
        #downloadDocxBtn { background: #2563eb; }
        #downloadMdBtn { background: #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/">◀ 返回首頁</a>
            <h2 style="margin: 0;">📄 全自動 OCR 與排版管線</h2>
            <div style="width: 80px;"></div>
        </div>
        
        <!-- 自訂範本區塊 -->
        <div style="background: #f1f5f9; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid #cbd5e1;">
            <h3 style="margin-top: 0; color: #334155;">📚 樣式範本設定</h3>
            <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 1rem;">
                目前使用範本: <strong id="currentTemplateName">載入中...</strong>
            </p>
            <div style="display: flex; gap: 10px;">
                <input type="file" id="templateInput" accept=".docx" style="display: none;">
                <button class="btn" style="background: #475569; width: auto; font-size: 1rem; padding: 8px 16px;" onclick="document.getElementById('templateInput').click()">上傳自訂 .docx 範本</button>
                <span id="templateUploadStatus" style="align-self: center; color: #16a34a; font-weight: bold; font-size: 0.9rem;"></span>
            </div>
            
            <div id="styleMappingSection" style="margin-top: 1rem; display: none;">
                <h4 style="margin: 0 0 0.5rem 0; color: #475569;">自訂階層樣式對應 (可選)</h4>
                <div style="display: flex; gap: 1rem; align-items: center; font-size: 0.9rem;">
                    <div>
                        <label for="h1Style">一級標題 (#): </label>
                        <select id="h1Style" style="padding: 4px; border-radius: 4px;"><option value="">(預設 Heading 1)</option></select>
                    </div>
                    <div>
                        <label for="h2Style">二級標題 (##): </label>
                        <select id="h2Style" style="padding: 4px; border-radius: 4px;"><option value="">(預設 Heading 2)</option></select>
                    </div>
                    <div>
                        <label for="h3Style">三級標題 (###): </label>
                        <select id="h3Style" style="padding: 4px; border-radius: 4px;"><option value="">(預設 Heading 3)</option></select>
                    </div>
                </div>
            </div>
        </div>

        <p style="text-align: center; color: #64748b; margin-bottom: 2rem;">上傳 PDF 檔案，自動呼叫 RapidDoc 進行版面分析、表格識別與中文辨識，並轉為 Word 文件。</p>

        <form id="uploadForm">
            <div class="upload-area" id="dropZone">
                <p>點擊選擇，或將 PDF 拖曳至此</p>
                <input type="file" id="fileInput" accept=".pdf" style="display: none;">
            </div>
            <div id="fileInfo" style="text-align: center; margin-bottom: 1rem; font-weight: bold;"></div>
            <button type="submit" class="btn" id="submitBtn" disabled>開始上傳並執行 OCR</button>
        </form>
        <div id="status"></div>
        <div class="btn-group">
            <a id="downloadDocxBtn" href="#">⬇️ 下載 Word (.docx)</a>
            <a id="downloadMdBtn" href="#">📄 下載 Markdown (.md)</a>
            <a id="outlineEditorBtn" href="javascript:void(0)" style="background: #8b5cf6;">✏️ 檢視與微調大綱</a>
        </div>
        
        <!-- Outline Editor Modal/Section -->
        <div id="outlineEditorSection" style="display: none; margin-top: 2rem; background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid #cbd5e1;">
            <h3 style="margin-top: 0;">🌳 大綱微調 (Outline Editor)</h3>
            <p style="color: #64748b; font-size: 0.9rem;">系統擷取出的標題如下，您可以手動修正階層，完成後點擊重新產生 DOCX。</p>
            <div id="outlineList" style="max-height: 400px; overflow-y: auto; background: white; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 1rem;">
                載入中...
            </div>
            <button id="saveOutlineBtn" class="btn" style="background: #16a34a; width: 100%;">儲存並重新產生 Word 文件</button>
            <div id="outlineSaveStatus" style="margin-top: 1rem; text-align: center; font-weight: bold;"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const downloadDocxBtn = document.getElementById('downloadDocxBtn');
        const downloadMdBtn = document.getElementById('downloadMdBtn');
        let currentFile = null;

        const templateInput = document.getElementById('templateInput');
        const templateUploadStatus = document.getElementById('templateUploadStatus');
        const currentTemplateName = document.getElementById('currentTemplateName');

        async function fetchTemplateStyles() {
            try {
                const res = await fetch('/api/get_template_styles');
                const data = await res.json();
                if (data.status === 'success' && data.styles.length > 0) {
                    const h1 = document.getElementById('h1Style');
                    const h2 = document.getElementById('h2Style');
                    const h3 = document.getElementById('h3Style');
                    
                    // Clear existing options except default
                    h1.innerHTML = '<option value="">(預設 Heading 1)</option>';
                    h2.innerHTML = '<option value="">(預設 Heading 2)</option>';
                    h3.innerHTML = '<option value="">(預設 Heading 3)</option>';
                    
                    data.styles.forEach(s => {
                        h1.innerHTML += `<option value="${s}">${s}</option>`;
                        h2.innerHTML += `<option value="${s}">${s}</option>`;
                        h3.innerHTML += `<option value="${s}">${s}</option>`;
                    });
                    
                    document.getElementById('styleMappingSection').style.display = 'block';
                }
            } catch (err) {
                console.error("無法取得樣式", err);
            }
        }

        // Fetch current template on load
        async function loadCurrentTemplate() {
            try {
                const res = await fetch('/api/get_current_template');
                const data = await res.json();
                currentTemplateName.textContent = data.name;
                if (data.has_custom) {
                    currentTemplateName.style.color = '#ea580c';
                }
                fetchTemplateStyles();
            } catch (err) {
                currentTemplateName.textContent = '無法取得狀態';
            }
        }
        window.addEventListener('DOMContentLoaded', loadCurrentTemplate);

        // Handle template upload
        templateInput.onchange = async (e) => {
            if (e.target.files.length === 0) return;
            const file = e.target.files[0];
            const formData = new FormData();
            formData.append('file', file);
            
            templateUploadStatus.textContent = '上傳中...';
            templateUploadStatus.style.color = '#64748b';
            
            try {
                const res = await fetch('/api/upload_template', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    templateUploadStatus.textContent = '✅ ' + data.message;
                    templateUploadStatus.style.color = '#16a34a';
                    loadCurrentTemplate();
                } else {
                    throw new Error(data.detail);
                }
            } catch (err) {
                templateUploadStatus.textContent = '❌ 上傳失敗: ' + err.message;
                templateUploadStatus.style.color = '#dc2626';
            }
            // Reset input so the same file can be selected again
            templateInput.value = '';
        };

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            currentFile = file;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileInfo.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding: 10px; background: #fff7ed; border-radius: 8px;">
                    <span style="font-size:2rem;">📄</span>
                    <span style="color: #334155;">已選擇: <b>${file.name}</b></span>
                    <span style="color:#64748b; font-weight:normal; font-size:0.85rem;">檔案大小: ${sizeMB} MB</span>
                </div>`;
            submitBtn.disabled = false;
            downloadDocxBtn.style.display = 'none';
            downloadMdBtn.style.display = 'none';
            statusDiv.textContent = '';
        }

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentFile) return;

            submitBtn.disabled = true;
            
            // Create a step-by-step checklist UI
            statusDiv.innerHTML = `
                <div style="text-align: left; background: #f8fafc; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 1rem;">
                    <div style="font-weight: bold; color: #ea580c; margin-bottom: 0.5rem;">🚀 處理管線已啟動，請勿關閉視窗...</div>
                    <ul style="list-style: none; padding: 0; margin: 0; font-size: 0.95rem; color: #475569; line-height: 1.8;">
                        <li id="step1">⏳ 1. 上傳檔案至伺服器</li>
                        <li id="step2" style="color:#94a3b8;">⚪ 2. 背景觸發 RapidDoc 模型分析</li>
                        <li id="step3" style="color:#94a3b8;">⚪ 3. 光學字元辨識與版面還原 (需時較長)</li>
                        <li id="step4" style="color:#94a3b8;">⚪ 4. 產生 Word 排版與 Markdown 檔案</li>
                    </ul>
                </div>
            `;
            
            downloadDocxBtn.style.display = 'none';
            downloadMdBtn.style.display = 'none';

            const formData = new FormData();
            formData.append('file', currentFile);
            
            const h1Style = document.getElementById('h1Style').value;
            const h2Style = document.getElementById('h2Style').value;
            const h3Style = document.getElementById('h3Style').value;
            if (h1Style || h2Style || h3Style) {
                formData.append('style_mapping', JSON.stringify({
                    h1: h1Style,
                    h2: h2Style,
                    h3: h3Style
                }));
            }

            
            formData.append('engine', document.getElementById('engineSelect').value);
            formData.append('left_ratio', document.getElementById('leftRatio').value);
            formData.append('right_ratio', document.getElementById('rightRatio').value);

            // Hide old fake progress
            statusDiv.innerHTML = `
                <div style="margin-top:20px; padding:20px; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc;">
                    <div style="font-weight:bold; margin-bottom:10px;">伺服器處理進度</div>
                    <div style="width: 100%; background: #e2e8f0; border-radius: 4px; overflow: hidden; height: 10px; margin-bottom:10px;">
                        <div id="progressBar" style="height: 10px; background: #3b82f6; width: 0%; transition: width 0.3s;"></div>
                    </div>
                    <div id="progressText" style="color: #475569; font-size: 0.9rem;">準備中...</div>
                </div>
            `;

            try {
                const response = await fetch('/api/upload_and_run_ocr', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'OCR 啟動失敗');
                }

                const result = await response.json();
                const stem = result.filename_stem;
                
                // Start polling
                const pollInterval = setInterval(async () => {
                    try {
                        const res = await fetch(`/api/ocr_progress/${stem}`);
                        const prog = await res.json();
                        
                        if(document.getElementById('progressBar')) {
                            document.getElementById('progressBar').style.width = prog.progress + '%';
                            document.getElementById('progressText').innerText = prog.message;
                        }
                        
                        if (prog.status === 'completed' || prog.progress === 100) {
                            clearInterval(pollInterval);
                            onComplete(stem);
                        }
                    } catch(e) {
                        console.error('Polling error', e);
                    }
                }, 1000);
                
                function onComplete(filename_stem) {
                    statusDiv.innerHTML += `<div style="margin-top:1rem; color:#16a34a; font-weight:bold;">✅ 處理完成，您可以下載檔案。</div>`;
                    
                    const btnContainer = document.createElement('div');
                    btnContainer.style.display = 'flex';
                    btnContainer.style.gap = '10px';
                    btnContainer.style.marginTop = '15px';
                    
                    const btnDocx = document.createElement('button');
                    btnDocx.innerText = '📁 本機另存 DOCX (原生視窗)';
                    btnDocx.style.padding = '10px 15px';
                    btnDocx.onclick = () => nativeSave(filename_stem, 'docx');
                    
                    const btnMd = document.createElement('button');
                    btnMd.innerText = '📁 本機另存 Markdown (原生視窗)';
                    btnMd.style.padding = '10px 15px';
                    btnMd.onclick = () => nativeSave(filename_stem, 'md');
                    
                    btnContainer.appendChild(btnDocx);
                    btnContainer.appendChild(btnMd);
                    
                    statusDiv.appendChild(btnContainer);
                    
                    document.getElementById('outlineEditorBtn').style.display = 'block';
                    document.getElementById('outlineEditorBtn').dataset.stem = filename_stem;
                }

            } catch (err) {
                statusDiv.innerHTML = `<div style="margin-top:1rem; padding:1rem; background:#fef2f2; border:1px solid #f87171; border-radius:8px; color:#dc2626;">
                    ❌ <b>執行失敗：</b>${err.message} <br>
                    <button onclick="submitBtn.click()" style="margin-top:10px; padding: 8px 16px; cursor:pointer; background: white; border: 1px solid #f87171; border-radius: 6px;">🔄 重新嘗試上傳</button>
                </div>`;
                submitBtn.disabled = false;
            }
        };
        
        async function nativeSave(stem, ext) {
            try {
                // Determine source path based on conventions
                // Using API to trigger save dialog on backend
                const source_path = `data/03_output/${stem}.${ext}`;
                const res = await fetch('/api/native_save_file', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({source_path, suggested_filename: `${stem}_extracted.${ext}`})
                });
                const result = await res.json();
                if(result.status === 'success') {
                    alert(`✅ 已成功儲存至：${result.saved_path}`);
                }
            } catch(e) {
                alert('❌ 儲存失敗');
            }
        }
 catch (err) {
                statusDiv.innerHTML = `<div style="margin-top:1rem; padding:1rem; background:#fef2f2; border:1px solid #f87171; border-radius:8px; color:#dc2626;">
                    ❌ <b>啟動失敗：</b>${err.message} <br>
                    <button onclick="submitBtn.click()" style="margin-top:10px; padding: 8px 16px; cursor:pointer; background: white; border: 1px solid #f87171; border-radius: 6px;">🔄 重新嘗試上傳</button>
                </div>`;
                submitBtn.disabled = false;
            }
        };

        // Outline Editor Logic
        let currentMdLines = [];
        
        document.getElementById('outlineEditorBtn').onclick = async function() {
            const stem = this.dataset.stem;
            if (!stem) return;
            
            document.getElementById('outlineEditorSection').style.display = 'block';
            document.getElementById('outlineList').innerHTML = '讀取中...';
            
            try {
                const res = await fetch(`/api/get_markdown/${stem}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                
                currentMdLines = data.content.split('\n');
                renderOutlineList();
            } catch (err) {
                document.getElementById('outlineList').innerHTML = `<span style="color:red">無法讀取 Markdown 檔案: ${err.message}</span>`;
            }
        };
        
        function renderOutlineList() {
            const listDiv = document.getElementById('outlineList');
            listDiv.innerHTML = '';
            
            currentMdLines.forEach((line, index) => {
                const match = line.match(/^(#{1,3})\s+(.*)$/);
                if (match) {
                    const level = match[1].length;
                    const text = match[2];
                    
                    const row = document.createElement('div');
                    row.style.display = 'flex';
                    row.style.gap = '10px';
                    row.style.marginBottom = '8px';
                    row.style.alignItems = 'center';
                    row.style.paddingLeft = `${(level - 1) * 20}px`;
                    
                    const select = document.createElement('select');
                    select.innerHTML = `
                        <option value="0">一般內文</option>
                        <option value="1" ${level===1?'selected':''}>H1</option>
                        <option value="2" ${level===2?'selected':''}>H2</option>
                        <option value="3" ${level===3?'selected':''}>H3</option>
                    `;
                    select.onchange = (e) => {
                        const newLevel = parseInt(e.target.value);
                        // Update line content
                        let cleanText = line.replace(/^(#{1,3})\s+/, '');
                        if (newLevel > 0) {
                            currentMdLines[index] = '#'.repeat(newLevel) + ' ' + cleanText;
                        } else {
                            currentMdLines[index] = cleanText;
                        }
                    };
                    
                    const span = document.createElement('span');
                    span.textContent = text;
                    span.style.flex = '1';
                    
                    row.appendChild(select);
                    row.appendChild(span);
                    listDiv.appendChild(row);
                }
            });
            
            if (listDiv.children.length === 0) {
                listDiv.innerHTML = '<span style="color:#64748b;">未偵測到任何標題，這可能是因為全文書籍皆為內文，或者偵測未命中。</span>';
            }
        }
        
        document.getElementById('saveOutlineBtn').onclick = async function() {
            const stem = document.getElementById('outlineEditorBtn').dataset.stem;
            const statusDiv = document.getElementById('outlineSaveStatus');
            
            statusDiv.textContent = '儲存並重新產生 Word 中...';
            statusDiv.style.color = '#ea580c';
            this.disabled = true;
            
            try {
                const res = await fetch(`/api/update_and_rebuild_docx/${stem}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ content: currentMdLines.join('\n') })
                });
                const data = await res.json();
                if (res.ok) {
                    statusDiv.textContent = '✅ ' + data.message;
                    statusDiv.style.color = '#16a34a';
                } else {
                    throw new Error(data.detail);
                }
            } catch (err) {
                statusDiv.textContent = '❌ 失敗: ' + err.message;
                statusDiv.style.color = '#dc2626';
            }
            this.disabled = false;
        };
    </script>
<script src="/static/sidebar.js"></script>
</body>
</html>
