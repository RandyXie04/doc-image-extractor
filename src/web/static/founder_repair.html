<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方正修復 - 轉檔工具箱</title>
    <link rel="stylesheet" href="/static/sidebar.css">
    <link rel="stylesheet" href="/static/toolbox.css">
</head>
<body>
    <div class="container">
        <header class="page-head">
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                返回工具箱
            </a>
            <div>
                <h1>方正修復</h1>
                <p class="page-lead">還原早期方正系統 PDF 或 DOCX 的 CMap 編碼缺陷與亂碼。不論上傳 PDF 或 DOCX，輸出一律是修復後的 Word。</p>
            </div>
        </header>

        <form id="uploadForm">
            <div class="dropzone" id="dropZone" role="button" tabindex="0" aria-label="選擇 PDF 或 DOCX 檔案">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="dropzone-title" id="fileNameDisplay">點擊選擇，或將檔案拖曳到這裡</p>
                <p class="dropzone-sub">支援 .pdf、.docx</p>
                <input type="file" id="fileInput" accept=".pdf,.docx">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn" disabled>先選擇檔案</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        let currentFile = null;

        dropZone.onclick = () => fileInput.click();
        dropZone.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } };
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            if (window.checkUploadFileSize && !window.checkUploadFileSize(file)) {
                fileInput.value = '';
                return;
            }
            currentFile = file;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileNameDisplay.innerHTML = `<span class="file-chip"><strong>${toolbox.escape(file.name)}</strong><small>${sizeMB} MB</small></span>`;
            submitBtn.disabled = false;
            submitBtn.textContent = '開始修復';
            statusDiv.innerHTML = '';
        }

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentFile) return;

            submitBtn.disabled = true;
            statusDiv.innerHTML = '<div class="alert">正在修復編碼，請稍候。</div>';

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const response = await fetch('/api/founder/repair', { method: 'POST', body: formData });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || '檔案格式或內容可能有誤');
                }
                const result = await response.json();
                if (result.success) {
                    statusDiv.innerHTML = `
                        <div class="result" id="resultCard">
                            <div class="result-head is-ok">修復完成</div>
                            <ul class="result-files">
                                <li>
                                    <div>
                                        <span class="file-name">${toolbox.escape(result.filename)}</span>
                                        <span class="file-desc">修復後的 Word 文件</span>
                                    </div>
                                    <button type="button" class="btn btn-primary btn-sm" id="saveDocxBtn">${toolbox.DOWNLOAD_ICON}另存 Word</button>
                                </li>
                            </ul>
                            <div class="result-note">檔案保留 ${window.APP_CONFIG.fileRetentionHours} 小時後自動銷毀，請及時另存。</div>
                        </div>`;
                    document.getElementById('saveDocxBtn').onclick = (ev) => toolbox.nativeSave({
                        sourcePath: result.source_path,
                        filename: result.filename,
                        button: ev.currentTarget,
                        fallbackUrl: null,
                        mountEl: document.getElementById('resultCard'),
                        label: 'Word'
                    });
                }
            } catch (error) {
                statusDiv.innerHTML = toolbox.errorPanel('修復失敗', error.message, 'submitBtn.click()');
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
    <script src="/static/sidebar.js"></script>
    <script src="/static/js/output.js"></script>
</body>
</html>
