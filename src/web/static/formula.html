<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF AI 公式萃取站</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            background-color: #f9fafb;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-area svg {
            width: 48px;
            height: 48px;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .options-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .option-card {
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }

        .input-group div {
            flex: 1;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .input-group input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        .input-group input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        button.submit-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }

        button.submit-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 2rem;
        }

        .progress-bar-bg {
            background-color: var(--border-color);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-bar-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        .log-container {
            margin-top: 1rem;
            background: #1f2937;
            color: #10b981;
            padding: 1rem;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            display: none;
        }

        #downloadBtn {
            display: none;
            margin-top: 1rem;
            background-color: #10b981;
        }
        #downloadBtn:hover {
            background-color: #059669;
        }

        #reportIssueBtn {
            display: none;
            margin-top: 0.75rem;
            background-color: #dc2626;
        }
        #reportIssueBtn:hover {
            background-color: #b91c1c;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .header-bar a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .header-bar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <span style="font-size: 0.875rem; color: var(--text-muted);">⚡ v2.1 Web Edition</span>
            <a href="https://github.com/RandyXie04/doc-image-extractor/issues" target="_blank">🐞 回報問題 / 建議</a>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <a href="/" style="text-decoration: none; color: var(--primary-color); font-weight: bold;">◀ 返回首頁</a>
            <h1 style="margin-bottom: 0;">PDF AI 公式萃取站</h1>
            <div style="width: 80px;"></div>
        </div>
        <p class="subtitle">AI 模型驅動：精準偵測獨立公式並無損裁切，轉為 Word 可編輯文件</p>

        <form id="uploadForm">
            <div class="upload-area" id="dropZone">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h3 id="fileNameDisplay">點擊或拖曳 PDF 檔案至此</h3>
                <input type="file" id="fileInput" name="file" accept=".pdf" required>
            </div>
            
            <div id="previewContainer" style="display: none; margin-bottom: 1.5rem; text-align: center;">
                <h4>裁切邊界預覽 (紅色=頂部, 藍色=底部, 綠色=左右)</h4>
                <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem;">
                    <button type="button" id="prevPageBtn" class="btn" style="padding: 5px 15px; min-width: auto;">◀ 上一頁</button>
                    <span>預覽頁碼: <span id="previewPageDisplay">1</span> / <span id="totalPagesDisplay">?</span></span>
                    <button type="button" id="nextPageBtn" class="btn" style="padding: 5px 15px; min-width: auto;">下一頁 ▶</button>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; text-align: left;">
                    <label>頂部裁切 (0~0.5): <span id="headerVal">0.10</span>
                        <input type="range" id="headerSlider" min="0" max="0.5" step="0.01" value="0.10" style="width: 100%;">
                    </label>
                    <label>底部裁切 (0~0.5): <span id="footerVal">0.10</span>
                        <input type="range" id="footerSlider" min="0" max="0.5" step="0.01" value="0.10" style="width: 100%;">
                    </label>
                    <label>左側邊距 (0~0.3): <span id="leftVal">0.00</span>
                        <input type="range" id="leftSlider" min="0" max="0.3" step="0.01" value="0.00" style="width: 100%;">
                    </label>
                    <label>右側邊距 (0~0.3): <span id="rightVal">0.00</span>
                        <input type="range" id="rightSlider" min="0" max="0.3" step="0.01" value="0.00" style="width: 100%;">
                    </label>
                </div>
                <div style="margin-top: 1rem; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: #fff;">
                    <img id="previewImage" src="" alt="預覽載入中..." style="max-width: 100%; height: auto; max-height: 400px; display: block; margin: 0 auto;">
                </div>
            </div>

            <div class="options-group">
                <label class="option-card">
                    <input type="checkbox" name="convert_word" checked> 
                    <span>轉換為 Word (動態裁邊)</span>
                </label>
                <label class="option-card">
                    <input type="checkbox" name="extract_formulas" checked> 
                    <span>萃取獨立數學公式 (AI)</span>
                </label>
            </div>

            <div class="options-group" style="margin-top: 0.8rem; background: #f8fafc; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color);">
                <label class="option-card" style="margin: 0; background: transparent; border: none; padding: 0.3rem;">
                    <input type="checkbox" name="extract_inline"> 
                    <span style="font-size: 0.9rem;">包含顯著行內公式 (Inline Math)</span>
                </label>
                <label class="option-card" style="margin: 0; background: transparent; border: none; padding: 0.3rem;">
                    <input type="checkbox" name="embed_formulas_in_word" checked> 
                    <span style="font-size: 0.9rem;">將 Word 內破碎公式替換為高清圖片 (圖文合成)</span>
                </label>
            </div>

            <div class="input-group" style="margin-top: 1rem;">
                <div>
                    <label>起始頁碼 (預設第 1 頁)</label>
                    <input type="number" name="start_page" placeholder="1" min="1">
                </div>
                <div>
                    <label>結束頁碼 (留空代表全本)</label>
                    <input type="number" name="end_page" placeholder="留空" min="1">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn" disabled>請先上傳 PDF 檔案</button>
        </form>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="status-text">
                <span id="statusMessage">上傳中...</span>
                <span id="percentageText">0%</span>
            </div>
            <div class="log-container" id="logContainer"></div>
            
            <div id="downloadActionGroup" style="display: none; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
                <div style="display: flex; gap: 1rem;">
                    <button id="downloadWordBtn" class="submit-btn" style="flex: 1; background: #2563eb; display: none;">📥 下載 Word 文件 (.docx)</button>
                    <button id="downloadZipBtn" class="submit-btn" style="flex: 1; background: #059669; display: none;">📥 下載公式圖片包 (.zip)</button>
                </div>
                <button id="openFolderBtn" class="submit-btn" style="background: #475569; width: 100%;">📁 在 Windows 檔案總管中檢視成果檔案</button>
            </div>
            <button id="reportIssueBtn" class="submit-btn" style="margin-top: 1rem;">🐞 一鍵至 GitHub 回報此問題</button>
        </div>
        
        <footer style="margin-top: 2.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
            遇到問題？前往 <a href="https://github.com/RandyXie04/doc-image-extractor/issues" target="_blank" style="color: var(--primary-color);">GitHub Issues</a> 反饋
        </footer>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const percentageText = document.getElementById('percentageText');
        const logContainer = document.getElementById('logContainer');
        const downloadActionGroup = document.getElementById('downloadActionGroup');
        const downloadWordBtn = document.getElementById('downloadWordBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const openFolderBtn = document.getElementById('openFolderBtn');
        const reportIssueBtn = document.getElementById('reportIssueBtn');
        
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const headerSlider = document.getElementById('headerSlider');
        const footerSlider = document.getElementById('footerSlider');
        const leftSlider = document.getElementById('leftSlider');
        const rightSlider = document.getElementById('rightSlider');
        const headerVal = document.getElementById('headerVal');
        const footerVal = document.getElementById('footerVal');
        const leftVal = document.getElementById('leftVal');
        const rightVal = document.getElementById('rightVal');

        let pollingInterval = null;
        let currentFileId = null;
        let currentFileName = "";
        let debounceTimer = null;
        let currentPreviewPage = 1;
        let totalPdfPages = 1;
        let lastErrorLog = "";

        // Drag and Drop Logic
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        fileInput.addEventListener('change', handleFileSelect);

        async function handleFileSelect() {
            if (!fileInput.files.length) return;
            const file = fileInput.files[0];
            currentFileName = file.name;
            fileNameDisplay.textContent = "上傳中: " + file.name;
            submitBtn.disabled = true;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch('/api/upload_file', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.file_id) {
                    currentFileId = data.file_id;
                    fileNameDisplay.textContent = file.name;
                    submitBtn.disabled = false;
                    submitBtn.textContent = "開始處理";
                    
                    totalPdfPages = data.total_pages || 1;
                    currentPreviewPage = 1;
                    document.getElementById('totalPagesDisplay').textContent = totalPdfPages;
                    document.getElementById('previewPageDisplay').textContent = currentPreviewPage;
                    
                    previewContainer.style.display = 'block';
                    updatePreview();
                }
            } catch (e) {
                alert('檔案上傳失敗: ' + e);
                fileNameDisplay.textContent = "點擊或拖曳 PDF 檔案至此";
            }
        }
        
        function updatePreview() {
            if (!currentFileId) return;
            const h = headerSlider.value;
            const f = footerSlider.value;
            const l = leftSlider.value;
            const r = rightSlider.value;
            headerVal.textContent = h;
            footerVal.textContent = f;
            leftVal.textContent = l;
            rightVal.textContent = r;
            
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                previewImage.src = `/api/render_preview/${currentFileId}?page=${currentPreviewPage}&header=${h}&footer=${f}&left=${l}&right=${r}&_t=${Date.now()}`;
            }, 500);
        }
        
        headerSlider.addEventListener('input', updatePreview);
        footerSlider.addEventListener('input', updatePreview);
        leftSlider.addEventListener('input', updatePreview);
        rightSlider.addEventListener('input', updatePreview);
        
        document.getElementById('prevPageBtn').addEventListener('click', () => {
            if (currentPreviewPage > 1) {
                currentPreviewPage--;
                document.getElementById('previewPageDisplay').textContent = currentPreviewPage;
                updatePreview();
            }
        });
        document.getElementById('nextPageBtn').addEventListener('click', () => {
            if (currentPreviewPage < totalPdfPages) {
                currentPreviewPage++;
                document.getElementById('previewPageDisplay').textContent = currentPreviewPage;
                updatePreview();
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentFileId) {
                alert('請先上傳檔案！');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "處理中...";
            progressContainer.style.display = 'block';
            logContainer.style.display = 'block';
            downloadActionGroup.style.display = 'none';
            reportIssueBtn.style.display = 'none';
            progressBar.style.width = '0%';
            percentageText.textContent = '0%';
            logContainer.innerHTML = '';
            lastErrorLog = '';

            const formData = new FormData();
            formData.append('file_id', currentFileId);
            formData.append('convert_word', document.querySelector('[name="convert_word"]').checked);
            formData.append('extract_formulas', document.querySelector('[name="extract_formulas"]').checked);
            formData.append('header_ratio', headerSlider.value);
            formData.append('footer_ratio', footerSlider.value);
            formData.append('left_ratio', leftSlider.value);
            formData.append('right_ratio', rightSlider.value);
            formData.append('extract_inline', document.querySelector('[name="extract_inline"]').checked);
            formData.append('embed_formulas_in_word', document.querySelector('[name="embed_formulas_in_word"]').checked);
            
            let start = document.querySelector('[name="start_page"]').value;
            let end = document.querySelector('[name="end_page"]').value;
            formData.append('start_page', start ? parseInt(start) - 1 : 0);
            formData.append('end_page', end ? parseInt(end) - 1 : 0);

            try {
                const response = await fetch('/api/process', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.task_id) {
                    statusMessage.textContent = "任務已建立，開始處理...";
                    startPolling(data.task_id);
                }
            } catch (err) {
                alert('啟動處理失敗：' + err);
                resetUI();
            }
        });

        function startPolling(taskId) {
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/status/${taskId}`);
                    const data = await response.json();

                    if (data.status === 'processing') {
                        progressBar.style.width = `${data.progress}%`;
                        percentageText.textContent = `${Math.round(data.progress)}%`;
                        statusMessage.textContent = data.message || "處理中...";
                        
                        if (data.log) {
                            lastErrorLog = data.log;
                            logContainer.innerHTML = data.log.replace(/\n/g, '<br>');
                            logContainer.scrollTop = logContainer.scrollHeight;
                        }
                    } 
                    else if (data.status === 'completed') {
                        clearInterval(pollingInterval);
                        progressBar.style.width = '100%';
                        percentageText.textContent = '100%';
                        statusMessage.textContent = "處理完成！";
                        submitBtn.textContent = "完成";
                        
                        // 呈現成果操作按鈕群組
                        downloadActionGroup.style.display = 'flex';
                        
                        // 定義通用 Blob 下載器，完全相容 WebView2 與瀏覽器環境
                        async function downloadFileBlob(url, fallbackName, btnElement) {
                            const origText = btnElement.textContent;
                            btnElement.disabled = true;
                            btnElement.textContent = "下載中...";
                            try {
                                const res = await fetch(url);
                                if (!res.ok) throw new Error("伺服器狀態碼 " + res.status);
                                const blob = await res.blob();
                                let filename = fallbackName;
                                const disposition = res.headers.get("content-disposition");
                                if (disposition && disposition.includes("filename=")) {
                                    filename = disposition.split("filename=")[1].replace(/["']/g, "").trim();
                                }
                                const blobUrl = window.URL.createObjectURL(blob);
                                const a = document.createElement("a");
                                a.style.display = "none";
                                a.href = blobUrl;
                                a.download = filename;
                                document.body.appendChild(a);
                                a.click();
                                setTimeout(() => {
                                    document.body.removeChild(a);
                                    window.URL.revokeObjectURL(blobUrl);
                                    btnElement.disabled = false;
                                    btnElement.textContent = origText;
                                }, 800);
                            } catch (err) {
                                alert("下載失敗：" + err.message);
                                btnElement.disabled = false;
                                btnElement.textContent = origText;
                            }
                        }

                        if (data.word_file) {
                            downloadWordBtn.style.display = 'block';
                            downloadWordBtn.onclick = () => {
                                downloadFileBlob(`/api/download/${taskId}/word`, '已轉檔.docx', downloadWordBtn);
                            };
                        } else {
                            downloadWordBtn.style.display = 'none';
                        }
                        
                        if (data.zip_file) {
                            downloadZipBtn.style.display = 'block';
                            downloadZipBtn.onclick = () => {
                                downloadFileBlob(`/api/download/${taskId}/formulas`, 'formulas.zip', downloadZipBtn);
                            };
                        } else {
                            downloadZipBtn.style.display = 'none';
                        }

                        openFolderBtn.onclick = async () => {
                            try {
                                const res = await fetch(`/api/open_folder/${taskId}`, { method: 'POST' });
                                if (!res.ok) {
                                    alert("無法自動打開檔案總管，檔案路徑位於專案 data 目錄下");
                                }
                            } catch (e) {
                                alert("呼叫開啟檔案總管失敗: " + e.message);
                            }
                        };

                        reportIssueBtn.style.display = 'none';
                        resetUI(false);
                    }
                    else if (data.status === 'failed') {
                        clearInterval(pollingInterval);
                        statusMessage.textContent = "處理失敗，請查看日誌。";
                        statusMessage.style.color = "#dc2626";
                        if (data.log) {
                            lastErrorLog = data.log;
                            logContainer.innerHTML = data.log.replace(/\n/g, '<br>');
                        }
                        reportIssueBtn.style.display = 'block';
                        reportIssueBtn.onclick = () => reportToGitHub(taskId);
                        resetUI();
                    }
                } catch (err) {
                    console.error("Polling error:", err);
                }
            }, 2000);
        }

        function reportToGitHub(taskId) {
            const title = `[轉檔異常回報] ${currentFileName || 'PDF 處理失敗'}`;
            const headerR = headerSlider.value;
            const footerR = footerSlider.value;
            const startP = document.querySelector('[name="start_page"]').value || '預設 (1)';
            const endP = document.querySelector('[name="end_page"]').value || '全本';
            
            const body = `### 📌 問題描述
在轉檔 PDF 時發生異常中斷。

### ⚙️ 執行環境與設定
- **檔案名稱**: \`${currentFileName}\`
- **任務 ID**: \`${taskId}\`
- **頁碼範圍**: 第 ${startP} 頁 至 第 ${endP} 頁
- **裁切比例**: 頂部 ${headerR}, 底部 ${footerR}
- **瀏覽器**: \`${navigator.userAgent}\`
- **時間戳記**: ${new Date().toISOString()}

### 📋 系統日誌 (Logs / Traceback)
\`\`\`text
${lastErrorLog || '未取得詳細錯誤日誌'}
\`\`\`

---
*此 Issue 由 Web 端一鍵回報功能自動產生*`;

            const issueUrl = `https://github.com/RandyXie04/doc-image-extractor/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
            window.open(issueUrl, '_blank');
        }

        function resetUI(enableBtn = true) {
            if (enableBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = "開始處理";
            }
        }
    </script>
