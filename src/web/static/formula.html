<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式提取 - 轉檔工具箱</title>
    <link rel="stylesheet" href="/static/sidebar.css">
    <link rel="stylesheet" href="/static/toolbox.css">
</head>
<body>
    <div class="container">
        <header class="page-head">
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                返回工具箱
            </a>
            <div>
                <h1>公式提取</h1>
                <p class="page-lead">精準偵測 PDF 中的獨立公式並無損裁切，轉為 Word 可編輯文件與高畫質圖片包。</p>
            </div>
        </header>

        <form id="uploadForm">
            <div class="dropzone" id="dropZone" role="button" tabindex="0" aria-label="選擇 PDF 檔案">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="dropzone-title" id="fileNameDisplay">點擊選擇，或將 PDF 檔案拖曳到這裡</p>
                <p class="dropzone-sub">支援向量與掃描版 PDF</p>
                <input type="file" id="fileInput" name="file" accept=".pdf" required>
            </div>

            <div id="previewContainer" class="panel" style="display: none;">
                <div class="panel-row" style="margin-bottom: 0.75rem;">
                    <div>
                        <h3 class="panel-title">裁切邊界預覽</h3>
                        <p class="hint" style="margin: 0;">設定頁面邊界，避開頁眉頁尾與邊欄裝飾圖示。</p>
                    </div>
                    <div class="pager">
                        <button type="button" id="prevPageBtn" class="btn btn-secondary btn-sm">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                            上一頁
                        </button>
                        <span>第 <strong id="previewPageDisplay">1</strong> / <span id="totalPagesDisplay">1</span> 頁</span>
                        <button type="button" id="nextPageBtn" class="btn btn-secondary btn-sm">
                            下一頁
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>

                <div class="crop-legend">
                    <span><span class="swatch swatch-top"></span>頂部頁眉 (<span id="headerVal" class="val-top">0.10</span>)</span>
                    <span><span class="swatch swatch-bottom"></span>底部頁尾 (<span id="footerVal" class="val-bottom">0.10</span>)</span>
                    <span><span class="swatch swatch-side"></span>左側邊距 (<span id="leftVal" class="val-side">0.00</span>)</span>
                    <span><span class="swatch swatch-side"></span>右側邊距 (<span id="rightVal" class="val-side">0.00</span>)</span>
                </div>

                <div class="slider-grid">
                    <div class="slider-item">
                        <label for="headerSlider">頂部裁切 <span id="headerValLabel" class="val-top">0.10</span></label>
                        <input type="range" id="headerSlider" min="0" max="0.5" step="0.01" value="0.10">
                    </div>
                    <div class="slider-item">
                        <label for="footerSlider">底部裁切 <span id="footerValLabel" class="val-bottom">0.10</span></label>
                        <input type="range" id="footerSlider" min="0" max="0.5" step="0.01" value="0.10">
                    </div>
                    <div class="slider-item">
                        <label for="leftSlider">左側邊距 <span id="leftValLabel" class="val-side">0.00</span></label>
                        <input type="range" id="leftSlider" min="0" max="0.3" step="0.01" value="0.00">
                    </div>
                    <div class="slider-item">
                        <label for="rightSlider">右側邊距 <span id="rightValLabel" class="val-side">0.00</span></label>
                        <input type="range" id="rightSlider" min="0" max="0.3" step="0.01" value="0.00">
                    </div>
                </div>

                <div class="preview-frame">
                    <img id="previewImage" src="" alt="裁切預覽載入中">
                </div>
            </div>

            <div class="panel">
                <div class="field" style="margin-bottom: 0.75rem;">
                    <label class="check">
                        <input type="checkbox" name="extract_inline" id="extractInline">
                        <span>
                            <span class="check-title">包含顯著行內公式 (Inline Math)</span>
                            <span class="hint" style="display:block;">預設僅提取獨立公式塊。若勾選，段落中長度顯著的公式亦會一併納入。</span>
                        </span>
                    </label>
                </div>
                <div class="grid-2">
                    <div class="field">
                        <label class="field-label" for="startPageInput">起始頁碼</label>
                        <input type="number" id="startPageInput" name="start_page" placeholder="預設第 1 頁" min="1" class="input">
                    </div>
                    <div class="field">
                        <label class="field-label" for="endPageInput">結束頁碼</label>
                        <input type="number" id="endPageInput" name="end_page" placeholder="留空代表全本" min="1" class="input">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn" disabled>先選擇 PDF 檔案</button>
        </form>

        <div id="progressArea" style="display: none; margin-top: 1.25rem;">
            <div class="progress">
                <span id="progressBar"></span>
            </div>
            <div class="progress-meta">
                <span id="statusMessage">準備處理…</span>
                <span id="percentageText">0%</span>
            </div>
            <details class="disclosure" id="logDetails" style="display: none; margin-top: 0.75rem;">
                <summary>檢視執行日誌</summary>
                <div class="path-box" id="logContainer" style="max-height: 220px; overflow-y: auto; white-space: pre-wrap;"></div>
            </details>
        </div>

        <div id="status" role="status" aria-live="polite"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const percentageText = document.getElementById('percentageText');
        const logDetails = document.getElementById('logDetails');
        const logContainer = document.getElementById('logContainer');
        const statusDiv = document.getElementById('status');

        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const headerSlider = document.getElementById('headerSlider');
        const footerSlider = document.getElementById('footerSlider');
        const leftSlider = document.getElementById('leftSlider');
        const rightSlider = document.getElementById('rightSlider');
        const headerVal = document.getElementById('headerVal');
        const footerVal = document.getElementById('footerVal');
        const leftVal = document.getElementById('leftVal');
        const rightVal = document.getElementById('rightVal');
        const headerValLabel = document.getElementById('headerValLabel');
        const footerValLabel = document.getElementById('footerValLabel');
        const leftValLabel = document.getElementById('leftValLabel');
        const rightValLabel = document.getElementById('rightValLabel');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const previewPageDisplay = document.getElementById('previewPageDisplay');
        const totalPagesDisplay = document.getElementById('totalPagesDisplay');

        let pollingInterval = null;
        let currentFileId = null;
        let currentFileName = "";
        let currentFileOrigName = "";
        let debounceTimer = null;
        let currentPreviewPage = 1;
        let totalPdfPages = 1;
        let lastErrorLog = "";
        let appMode = "editor";

        fetch('/api/app_mode').then(r => r.json()).then(d => {
            if (d && d.mode) appMode = d.mode;
        }).catch(() => {});

        dropZone.onclick = () => fileInput.click();
        dropZone.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } };
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        };

        fileInput.onchange = handleFileSelect;

        async function handleFileSelect() {
            if (!fileInput.files.length) return;
            const file = fileInput.files[0];
            if (window.checkUploadFileSize && !window.checkUploadFileSize(file)) {
                fileInput.value = "";
                return;
            }
            currentFileName = file.name;
            currentFileOrigName = file.name.replace(/\.[^/.]+$/, "");
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileNameDisplay.innerHTML = `<span class="file-chip"><strong>${toolbox.escape(file.name)}</strong><small>上傳中 (${sizeMB} MB)…</small></span>`;
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload_file', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '上傳失敗');

                if (data.file_id) {
                    currentFileId = data.file_id;
                    if (data.orig_name) currentFileOrigName = data.orig_name;
                    fileNameDisplay.innerHTML = `<span class="file-chip"><strong>${toolbox.escape(file.name)}</strong><small>${sizeMB} MB</small></span>`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = "開始提取公式";

                    totalPdfPages = data.total_pages || 1;
                    currentPreviewPage = 1;
                    totalPagesDisplay.textContent = totalPdfPages;
                    previewPageDisplay.textContent = currentPreviewPage;

                    previewContainer.style.display = 'block';
                    updatePreview();
                }
            } catch (e) {
                fileNameDisplay.textContent = '點擊選擇，或將 PDF 檔案拖曳到這裡';
                submitBtn.disabled = true;
                statusDiv.innerHTML = toolbox.errorPanel('上傳失敗', e.message, 'fileInput.click()');
            }
        }

        function updatePreview() {
            if (!currentFileId) return;
            const h = headerSlider.value;
            const f = footerSlider.value;
            const l = leftSlider.value;
            const r = rightSlider.value;

            headerVal.textContent = h;
            headerValLabel.textContent = h;
            footerVal.textContent = f;
            footerValLabel.textContent = f;
            leftVal.textContent = l;
            leftValLabel.textContent = l;
            rightVal.textContent = r;
            rightValLabel.textContent = r;

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                previewImage.src = `/api/render_preview/${currentFileId}?page=${currentPreviewPage}&header=${h}&footer=${f}&left=${l}&right=${r}&_t=${Date.now()}`;
            }, 350);
        }

        headerSlider.oninput = updatePreview;
        footerSlider.oninput = updatePreview;
        leftSlider.oninput = updatePreview;
        rightSlider.oninput = updatePreview;

        prevPageBtn.onclick = () => {
            if (currentPreviewPage > 1) {
                currentPreviewPage--;
                previewPageDisplay.textContent = currentPreviewPage;
                updatePreview();
            }
        };

        nextPageBtn.onclick = () => {
            if (currentPreviewPage < totalPdfPages) {
                currentPreviewPage++;
                previewPageDisplay.textContent = currentPreviewPage;
                updatePreview();
            }
        };

        uploadForm.onsubmit = async (e) => {
            e.preventDefault();
            if (!currentFileId) {
                toolbox.notify('請先上傳 PDF 檔案', 'warning');
                return;
            }

            submitBtn.disabled = true;
            statusDiv.innerHTML = '';
            progressArea.style.display = 'block';
            progressBar.style.width = '0%';
            percentageText.textContent = '0%';
            statusMessage.textContent = '任務建立中…';
            logContainer.textContent = '';
            lastErrorLog = '';
            if (appMode !== 'editor') logDetails.style.display = 'block';

            const formData = new FormData();
            formData.append('file_id', currentFileId);
            formData.append('orig_name', currentFileOrigName);
            formData.append('extract_formulas', 'true');
            formData.append('header_ratio', headerSlider.value);
            formData.append('footer_ratio', footerSlider.value);
            formData.append('left_ratio', leftSlider.value);
            formData.append('right_ratio', rightSlider.value);
            formData.append('extract_inline', document.getElementById('extractInline').checked);

            const start = document.getElementById('startPageInput').value;
            const end = document.getElementById('endPageInput').value;
            formData.append('start_page', start ? parseInt(start, 10) - 1 : 0);
            formData.append('end_page', end ? parseInt(end, 10) - 1 : 0);

            try {
                const response = await fetch('/api/process', { method: 'POST', body: formData });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || '啟動處理失敗');
                }
                const data = await response.json();
                if (data.task_id) {
                    statusMessage.textContent = '正在萃取公式…';
                    startPolling(data.task_id);
                } else {
                    throw new Error('未取得有效的任務 ID');
                }
            } catch (err) {
                statusDiv.innerHTML = toolbox.errorPanel('處理啟動失敗', err.message);
                submitBtn.disabled = false;
                progressArea.style.display = 'none';
            }
        };

        function startPolling(taskId) {
            clearInterval(pollingInterval);
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/status/${taskId}`);
                    if (!response.ok) throw new Error(`狀態查詢異常 (${response.status})`);
                    const data = await response.json();

                    if (data.status === 'processing') {
                        const pct = Math.round(data.progress || 0);
                        progressBar.style.width = pct + '%';
                        percentageText.textContent = pct + '%';
                        statusMessage.textContent = data.message || '處理中…';

                        if (data.log) {
                            lastErrorLog = data.log;
                            logContainer.textContent = data.log;
                            logContainer.scrollTop = logContainer.scrollHeight;
                        }
                    } else if (data.status === 'completed') {
                        clearInterval(pollingInterval);
                        progressBar.style.width = '100%';
                        percentageText.textContent = '100%';
                        statusMessage.textContent = '處理完成';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '重新處理';

                        const zipName = `${currentFileOrigName || 'formulas'}_formulas.zip`;
                        const sourceZipPath = data.zip_file || data.result_file || '';
                        const downloadUrl = `/api/download/${taskId}/formulas`;

                        statusDiv.innerHTML = `
                            <div class="result" id="resultCard">
                                <div class="result-head is-ok">公式提取完成</div>
                                <ul class="result-files">
                                    <li>
                                        <div>
                                            <span class="file-name">${toolbox.escape(zipName)}</span>
                                            <span class="file-desc">包含所有無損裁切的公式圖片 (.png) 與對應的 LaTeX 語法檔案</span>
                                        </div>
                                        <button type="button" class="btn btn-primary btn-sm" id="saveZipBtn">${toolbox.DOWNLOAD_ICON}另存 ZIP</button>
                                    </li>
                                </ul>
                                <div class="result-note" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                                    <span>檔案保留 ${window.APP_CONFIG.fileRetentionHours} 小時後自動銷毀，請及時另存。</span>
                                    <button type="button" class="btn btn-secondary btn-sm" id="openFolderBtn">在檔案總管中顯示</button>
                                </div>
                            </div>`;

                        document.getElementById('saveZipBtn').onclick = (ev) => toolbox.nativeSave({
                            sourcePath: sourceZipPath,
                            filename: zipName,
                            button: ev.currentTarget,
                            fallbackUrl: downloadUrl,
                            mountEl: document.getElementById('resultCard'),
                            label: '公式 ZIP'
                        });

                        document.getElementById('openFolderBtn').onclick = () => {
                            if (sourceZipPath) {
                                toolbox.openFolder(sourceZipPath);
                            } else {
                                fetch(`/api/open_folder/${taskId}`, { method: 'POST' }).catch(() => {
                                    toolbox.notify('無法開啟本機檔案總管', 'warning');
                                });
                            }
                        };
                    } else if (data.status === 'failed') {
                        clearInterval(pollingInterval);
                        submitBtn.disabled = false;
                        submitBtn.textContent = '重新處理';
                        statusMessage.textContent = '處理失敗';
                        if (data.log) {
                            lastErrorLog = data.log;
                            logContainer.textContent = data.log;
                            logDetails.style.display = 'block';
                            logDetails.open = true;
                        }
                        statusDiv.innerHTML = toolbox.errorPanel('公式提取失敗', data.message || '處理過程中發生異常', 'uploadForm.dispatchEvent(new Event("submit"))');
                    }
                } catch (err) {
                    console.error('Polling error:', err);
                }
            }, 1800);
        }
    </script>
    <script src="/static/sidebar.js"></script>
    <script src="/static/js/output.js"></script>
</body>
</html>
