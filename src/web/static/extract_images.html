<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件圖片無損提取器</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: transparent;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        
        :root[data-theme="light"] {
            --bg: transparent;
            --card: rgba(255, 255, 255, 0.7);
            --border: rgba(148, 163, 184, 0.3);
            --text-main: #0f172a;
            --text-muted: #475569;
        }
        :root[data-theme="light"] .upload-area { background-color: rgba(255, 255, 255, 0.6); }
        body { font-family: 'Inter', system-ui, sans-serif; display: flex; justify-content: center; padding: 3rem; color: var(--text-main); }
        .container { 
            background: var(--card); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.5); 
            max-width: 600px; width: 100%; 
            border: 1px solid rgba(255,255,255,0.6);
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .header a { text-decoration: none; color: var(--primary); font-weight: 600; background: rgba(99, 102, 241, 0.1); padding: 6px 12px; border-radius: 6px; transition: 0.2s; }
        .header a:hover { background: rgba(99, 102, 241, 0.2); }
        .upload-area { border: 2px dashed var(--border); border-radius: 16px; padding: 3.5rem 2rem; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 2rem; background-color: rgba(255, 255, 255, 0.02); position: relative; overflow: hidden; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--primary); background-color: rgba(255, 255, 255, 0.05); transform: scale(1.01); }
        .upload-area svg { width: 56px; height: 56px; color: var(--primary); margin-bottom: 1.2rem; transition: transform 0.3s; }
        .upload-area:hover svg { transform: translateY(-5px); }
        .upload-area input[type="file"] { display: none; }
        .btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1.1rem; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: all 0.3s; letter-spacing: 0.02em; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
        #status { margin-top: 1.5rem; text-align: center; font-weight: 500; color: #475569; }
        #downloadBtn { display: none; margin-top: 1rem; text-align: center; text-decoration: none; background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }
        #downloadBtn:hover { box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/">◀ 返回首頁</a>
            <h2 style="margin: 0;">🖼️ 圖片無損提取器</h2>
            <div style="width: 80px;"></div>
        </div>
        <p style="text-align: center; color: #64748b; margin-bottom: 2rem;">上傳 PDF 或 DOCX 檔案，自動批量提取內嵌高畫質圖片並打包為 ZIP 壓縮檔。</p>

        <form id="uploadForm">
            <div class="upload-area" id="dropZone">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h3 id="fileNameDisplay" style="margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 500;">點擊選擇，或將 PDF / DOCX 拖曳至此</h3>
                <input type="file" id="fileInput" accept=".pdf,.docx">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="toGrayscale" name="toGrayscale">
                    將所有提取的彩色圖片轉換為黑白灰階
                </label>
            </div>

            <div id="fileInfo" style="text-align: center; margin-bottom: 1rem; font-weight: bold;"></div>
            <button type="submit" class="btn" id="submitBtn" disabled>開始提取圖片</button>
        </form>
        <div id="status"></div>
        <a id="downloadBtn" class="btn" href="#">⬇️ 下載圖片 ZIP 壓縮包</a>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        let currentFile = null;

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            currentFile = file;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileInfo.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding: 10px; background: #f1f5f9; border-radius: 8px;">
                    <span style="font-size:2rem;">📄</span>
                    <span style="color: #334155;">已選擇: <b>${file.name}</b></span>
                    <span style="color:#64748b; font-weight:normal; font-size:0.85rem;">檔案大小: ${sizeMB} MB</span>
                </div>`;
            submitBtn.disabled = false;
            downloadBtn.style.display = 'none';
            statusDiv.textContent = '';
        }

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentFile) return;

            submitBtn.disabled = true;
            statusDiv.style.color = '#0284c7';
            statusDiv.textContent = '🚀 正在上傳並提取檔案中的高畫質圖片，請稍候...';
            downloadBtn.style.display = 'none';

            const toGrayscale = document.getElementById('toGrayscale').checked;
            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('to_grayscale', toGrayscale);

            try {
                const response = await fetch('/api/extract_images', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || '圖片提取伺服器處理失敗');
                }

                const result = await response.json();
                if (result.success && result.count > 0) {
                    statusDiv.style.color = '#16a34a';
                    statusDiv.innerHTML = `🎉 <b>處理完成！</b> 共成功提取 <b>${result.count}</b> 張高品質圖片。`;
                    
                    const btnContainer = document.createElement('div');
                    btnContainer.id = 'saveBtnContainer';
                    btnContainer.style.display = 'flex';
                    btnContainer.style.gap = '10px';
                    btnContainer.style.marginTop = '15px';
                    btnContainer.style.justifyContent = 'center';
                    
                    const btnSave = document.createElement('button');
                    btnSave.className = 'btn';
                    btnSave.style.background = '#2563eb';
                    btnSave.innerText = '📁 本機另存 ZIP (原生視窗)';
                    btnSave.onclick = (e) => nativeSave(result.source_path, result.filename, e.currentTarget, result.download_url);
                    
                    btnContainer.appendChild(btnSave);
                    statusDiv.appendChild(btnContainer);
                } else {
                    statusDiv.style.color = '#eab308';
                    statusDiv.textContent = '⚠️ 此文件中未偵測到任何內嵌圖片。';
                }
            } catch (err) {
                statusDiv.innerHTML = `<div style="margin-top:1rem; padding:1rem; background:#fef2f2; border:1px solid #f87171; border-radius:8px; color:#dc2626;">
                    ❌ <b>發生錯誤：</b>${err.message} <br>
                    <button onclick="submitBtn.click()" style="margin-top:10px; padding: 8px 16px; cursor:pointer; background: white; border: 1px solid #f87171; border-radius: 6px;">🔄 重新嘗試</button>
                </div>`;
            } finally {
                submitBtn.disabled = false;
            }
        };

        async function nativeSave(source_path, suggested_filename, btnElement, fallbackUrl) {
            const origText = btnElement ? btnElement.innerText : '';
            if (btnElement) {
                btnElement.disabled = true;
                btnElement.innerText = '⏳ 請在開啟的視窗中選擇儲存位置...';
            }
            try {
                const res = await fetch('/api/native_save_file', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({source_path, suggested_filename})
                });
                
                if (!res.ok) {
                    throw new Error(`伺服器回應異常 (${res.status})`);
                }
                const result = await res.json();
                
                if (result.status === 'success') {
                    if (btnElement) {
                        btnElement.innerText = `✅ 已儲存`;
                        btnElement.disabled = false;
                    }
                    
                    let saveInfoId = `savedInfo_img`;
                    let savedInfo = document.getElementById(saveInfoId);
                    if (!savedInfo) {
                        savedInfo = document.createElement('div');
                        savedInfo.id = saveInfoId;
                        savedInfo.style.marginTop = '0.8rem';
                        savedInfo.style.padding = '0.8rem';
                        savedInfo.style.background = '#f0fdf4';
                        savedInfo.style.border = '1px solid #bbf7d0';
                        savedInfo.style.borderRadius = '8px';
                        savedInfo.style.color = '#166534';
                        savedInfo.style.fontSize = '0.9rem';
                        const container = document.getElementById('saveBtnContainer') || statusDiv;
                        container.parentNode.insertBefore(savedInfo, container.nextSibling);
                    }
                    savedInfo.innerHTML = `<div><b>文件已成功儲存至：</b></div>
                    <div style="margin:4px 0; word-break:break-all; font-family:monospace; background:#fff; padding:6px; border-radius:4px; border:1px solid #dcfce7;">${result.saved_path}</div>
                    <button type="button" class="btn" style="margin-top:6px; padding:6px 12px; background:#15803d; color:white; font-size:0.85rem;" onclick="openSavedPath('${result.saved_path.replace(/\\/g, '\\\\')}')">📂 在 Windows 檔案總管中開啟</button>`;
                } else if (result.status === 'cancelled') {
                    if (btnElement) {
                        btnElement.innerText = origText;
                        btnElement.disabled = false;
                    }
                } else {
                    console.warn('原生另存降級為瀏覽器直接下載:', result.message);
                    window.location.href = fallbackUrl;
                    if (btnElement) {
                        btnElement.innerText = origText;
                        btnElement.disabled = false;
                    }
                }
            } catch(e) {
                console.warn('原生另存發生錯誤，降級為瀏覽器下載:', e);
                window.location.href = fallbackUrl;
                if (btnElement) {
                    btnElement.innerText = origText;
                    btnElement.disabled = false;
                }
            }
        }

        async function openSavedPath(filePath) {
            try {
                await fetch('/api/open_file_folder', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({file_path: filePath})
                });
            } catch(err) {
                alert('無法開啟檔案總管: ' + err.message);
            }
        }
    </script>
<script src="/static/sidebar.js"></script>
</body>
</html>
