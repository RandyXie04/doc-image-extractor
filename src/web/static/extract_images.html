<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片提取 - 轉檔工具箱</title>
    <link rel="stylesheet" href="/static/sidebar.css">
    <link rel="stylesheet" href="/static/toolbox.css">
</head>
<body>
    <div class="container">
        <header class="page-head">
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                返回工具箱
            </a>
            <div>
                <h1>圖片提取</h1>
                <p class="page-lead">從 PDF 或 DOCX 取出內嵌的原始畫質圖片，打包成一個 ZIP。DOCX 只會取出文件中仍在使用的圖片，已刪除的歷史圖片不會出現。</p>
            </div>
        </header>

        <form id="uploadForm">
            <div class="dropzone" id="dropZone" role="button" tabindex="0" aria-label="選擇 PDF 或 DOCX 檔案">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="dropzone-title" id="fileNameDisplay">點擊選擇，或將檔案拖曳到這裡</p>
                <p class="dropzone-sub">支援 .pdf、.docx</p>
                <input type="file" id="fileInput" accept=".pdf,.docx">
            </div>

            <div class="field">
                <label class="check">
                    <input type="checkbox" id="toGrayscale" name="toGrayscale">
                    <span>
                        <span class="check-title">轉為灰階</span>
                        <span class="hint" style="display:block;">適用黑白印刷。透明背景會填成白色。</span>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn" disabled>先選擇檔案</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        let currentFile = null;

        dropZone.onclick = () => fileInput.click();
        dropZone.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } };
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            if (window.checkUploadFileSize && !window.checkUploadFileSize(file)) {
                fileInput.value = '';
                return;
            }
            currentFile = file;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileNameDisplay.innerHTML = `<span class="file-chip"><strong>${toolbox.escape(file.name)}</strong><small>${sizeMB} MB</small></span>`;
            submitBtn.disabled = false;
            submitBtn.textContent = '開始提取圖片';
            statusDiv.innerHTML = '';
        }

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentFile) return;

            submitBtn.disabled = true;
            statusDiv.innerHTML = '<div class="alert">正在上傳並提取圖片，大型檔案可能需要數十秒。</div>';

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('to_grayscale', document.getElementById('toGrayscale').checked);

            try {
                const response = await fetch('/api/extract_images', { method: 'POST', body: formData });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || '伺服器處理失敗');
                }
                const result = await response.json();
                if (result.success && result.count > 0) {
                    statusDiv.innerHTML = `
                        <div class="result" id="resultCard">
                            <div class="result-head is-ok">提取完成：共 ${result.count} 張圖片</div>
                            <ul class="result-files">
                                <li>
                                    <div>
                                        <span class="file-name">${toolbox.escape(result.filename)}</span>
                                        <span class="file-desc">圖片 ZIP，檔名依原文件順序編號</span>
                                    </div>
                                    <button type="button" class="btn btn-primary btn-sm" id="saveZipBtn">${toolbox.DOWNLOAD_ICON}另存 ZIP</button>
                                </li>
                            </ul>
                            <div class="result-note">檔案保留 ${window.APP_CONFIG.fileRetentionHours} 小時後自動銷毀，請及時另存。</div>
                        </div>`;
                    document.getElementById('saveZipBtn').onclick = (ev) => toolbox.nativeSave({
                        sourcePath: result.source_path,
                        filename: result.filename,
                        button: ev.currentTarget,
                        fallbackUrl: result.download_url,
                        mountEl: document.getElementById('resultCard'),
                        label: 'ZIP'
                    });
                } else {
                    statusDiv.innerHTML = `<div class="alert alert-warning"><div class="alert-title">沒有找到內嵌圖片</div>${toolbox.escape(result.message || '此文件沒有可提取的內嵌圖片。若頁面上的圖是向量繪圖，請改用「全自動整稿」。')}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = toolbox.errorPanel('提取失敗', err.message, 'submitBtn.click()');
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
    <script src="/static/js/viewport_manager.js"></script>
    <script src="/static/sidebar.js"></script>
    <script src="/static/js/output.js"></script>
</body>
</html>
