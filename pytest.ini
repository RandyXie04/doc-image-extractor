[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: Fast in-memory unit tests with mocked dependencies (<0.1s)
    integration: Component integration tests (TestClient, AST, file conversions)
    heavy: Heavy compute, local models, GPU, or external services
    security: Security, auth, LAN guard, and path boundary tests
addopts = -q --strict-markers -m "not heavy"
asyncio_mode = auto
